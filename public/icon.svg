<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad_blue" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="grad_purple" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="grad_pink" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC4899" />
      <stop offset="1" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="90"/>
  
  <!-- Stacked cards -->
  <rect x="120" y="220" width="200" height="200" rx="45" transform="rotate(-15 220 320)" fill="url(#grad_blue)" />
  <rect x="156" y="156" width="200" height="200" rx="45" transform="rotate(0 256 256)" fill="url(#grad_purple)" />
  <rect x="192" y="92" width="200" height="200" rx="45" transform="rotate(15 292 192)" fill="url(#grad_pink)" />
  
  <!-- S letter -->
  <path d="M220 180 C 220 180, 290 180, 290 230 C 290 280, 220 280, 220 330 C 220 380, 290 380, 290 380" stroke="white" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
