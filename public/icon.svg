<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad_cyan" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#06B6C6" />
    </linearGradient>
    <linearGradient id="grad_teal" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="grad_emerald" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="#0f172a" />

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="white" stroke-width="2" opacity="0.04" />

  <!-- Stacked cards with refined positioning -->
  <!-- Bottom card - emerald -->
  <rect x="128" y="228" width="208" height="196" rx="42" fill="url(#grad_emerald)" opacity="0.92"
        transform="rotate(-12 232 326)" />
  <!-- Middle card - teal -->
  <rect x="152" y="168" width="208" height="196" rx="42" fill="url(#grad_teal)" opacity="0.94"
        transform="rotate(0 256 266)" />
  <!-- Top card - cyan -->
  <rect x="176" y="108" width="208" height="196" rx="42" fill="url(#grad_cyan)" opacity="0.96"
        transform="rotate(12 280 206)" />

  <!-- Refined S letter -->
  <path d="M236 160 C 236 160, 276 160, 276 190 C 276 220, 236 220, 236 240 C 236 260, 276 260, 276 280 C 276 310, 236 310, 236 310"
        stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
</svg>
